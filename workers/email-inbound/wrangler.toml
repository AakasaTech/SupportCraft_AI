name = "supportcraft-email-inbound"
main = "index.ts"
compatibility_date = "2025-01-01"

# ── Email routing ──────────────────────────────────────────────────────────────
# Email Worker routing is NOT configured here.
# Set it in: Cloudflare Dashboard → <your zone> → Email → Email Routing
#   → Routing rules → Catch-all → Action: Send to a Worker
#   → select "supportcraft-email-inbound"
# ──────────────────────────────────────────────────────────────────────────────

[vars]
# Replace <project-ref> with your Supabase project reference (Settings → API → Project URL)
SUPABASE_INBOUND_URL = "https://fkobprkmycdbnbzkwhwm.supabase.co/functions/v1/email-inbound"

[[kv_namespaces]]
binding = "TENANT_MAP"
# Create with: wrangler kv namespace create TENANT_MAP
# Paste the "id" from the output below:
id = "6ed261c9df5d41a1b3c0e041213d751c"

# ── Secrets — NEVER put real values here, use the CLI: ────────────────────────
#   wrangler secret put INBOUND_SECRET
#   (must match INBOUND_SECRET in your .env.production)
